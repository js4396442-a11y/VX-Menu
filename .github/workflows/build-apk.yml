name: Build VX Menu APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Flutter project
        run: |
          unzip -o vx_menu_flutter.zip -d extracted

      - name: Build APK
        id: build
        run: |
          PROJECT_DIR=$(find extracted -name pubspec.yaml -print -quit | xargs dirname)

          echo "Projeto encontrado em: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

          echo "apk_path=$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VX-Menu-APK
          path: ${{ steps.build.outputs.apk_path }}
